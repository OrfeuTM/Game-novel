<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Novel</title>
    
    <!-- Link para o seu arquivo CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Scripts carregados com 'defer' (ótima prática de performance!) -->
    <script src="js/historia.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body>

    <!-- Container principal que agrupa todo o cenário e personagens -->
    <div class="cenario-container">
        
        <!-- Imagem de fundo do cenário -->
        <img id="background-screen" src="assets/bg/quarto_split.png" alt="Cenário do Quarto">
        
        <!-- Personagem em tela -->
        <img id="personagem" src="assets/personagens/lisa/lisa_neutra_sf.png" alt="personagem Lisa">

        <!-- Caixa de texto com o diálogo -->
        <h2 class="texto-dialogo">Olá, meu nome é Lisa, 17 anos e estou no ensino médio junto com meu irmão Mono.</h2>
        
    </div>

</body>
</html>
